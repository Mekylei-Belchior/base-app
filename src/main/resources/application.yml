spring:
  application:
    name: base-app

server:
  port: 8080

app:
  environment: ${APP_ENV:dev}

management:
  endpoints:
    web:
      exposure:
        # prometheus: consumido pelo Prometheus/Grafana para métricas da JVM e app
        include: "health,info,prometheus"
  endpoint:
    health:
      # Nunca expõe detalhes internos (env, DB credentials, etc.)
      show-details: never
      # Ativa /actuator/health/liveness e /actuator/health/readiness explicitamente
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Documentação da API via Springdoc OpenAPI (Swagger UI)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
