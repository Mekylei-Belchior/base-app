apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    # kustomize aplica o nameSuffix automaticamente neste campo (nameReference).
    name: app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Escala quando a média de CPU ultrapassa 70% do request.
          averageUtilization: 70
