resources:
  - ../../base

nameSuffix: -prod

patches:
  - path: patch.yaml
    target:
      kind: Deployment
      name: app
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: app

configMapGenerator:
  - name: app-config
    envs:
      - config.env

# Secrets NÃO são gerenciados pelo Kustomize para evitar valores sensíveis no Git.
# Execute scripts/create-secrets.sh para criar o secret 'app-secret-prod' no cluster.

images:
  - name: app
    newName: 192.168.0.106:5000/app
    newTag: latest
