apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  # replicas removido: o HPA assume o controle (minReplicas: 2, maxReplicas: 5).
  # Manter replicas fixo conflita com o HPA e causa oscilações desnecessárias.
  template:
    spec:
      containers:
        - name: app
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
