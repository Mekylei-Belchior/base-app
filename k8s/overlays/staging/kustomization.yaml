resources:
  - ../../base

nameSuffix: -staging

patches:
  - path: patch.yaml
    target:
      kind: Deployment
      name: app

configMapGenerator:
  - name: app-config
    envs:
      - config.env

secretGenerator:
  - name: app-secret
    literals:
      - DB_PASSWORD=stg123

images:
  - name: app
    newName: 192.168.0.106:5000/app
    newTag: latest
