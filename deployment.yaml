apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-local
  template:
    metadata:
      labels:
        app: app-local
    spec:
      containers:
      - name: app
        image: app-local:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
