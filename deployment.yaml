apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: base-app
  template:
    metadata:
      labels:
        app: base-app
    spec:
      containers:
      - name: app
        image: app-local:v1
        ports:
        - containerPort: 3000
        imagePullPolicy: IfNotPresent
