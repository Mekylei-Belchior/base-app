plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.baseapp'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Força versões mínimas seguras para dependências gerenciadas pelo Spring BOM.
// Corrige CVEs reportados pelo Trivy: Tomcat (CVE-2026-29145 CRITICAL e outros)
// e Spring Framework (CVE-2025-41249 HIGH).
ext['tomcat.version']           = '10.1.54'
ext['spring-framework.version'] = '6.2.11'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
    // Gera o relatório JaCoCo automaticamente ao final de cada execução de testes
    finalizedBy jacocoTestReport
}

// Gera relatório HTML + XML (XML é consumido por plugins do Jenkins/SonarQube)
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Verificação de cobertura mínima — executada explicitamente pelo pipeline ("Quality Gate").
// Separada da task :test para não bloquear o build local por cobertura insuficiente.
// Para enforçar localmente: ./gradlew jacocoTestCoverageVerification
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value   = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

bootJar {
    archiveFileName = 'base-app.jar'
}
